name: drift

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: List verified skills past their re-verification date
        id: scan
        run: |
          node scripts/check-freshness.mjs --markdown > stale.md
          if [ -s stale.md ]; then echo "stale=true" >> "$GITHUB_OUTPUT"; fi
      - name: Open an issue
        if: steps.scan.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "Skills due for re-verification" --body-file stale.md
